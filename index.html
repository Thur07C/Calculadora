<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Python</title>
    <style>
        body {
            font-family: 'Arial', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .window {
            background-color: #f0f0f0;
            border: 1px solid #707070;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 320px;
            overflow: hidden;
        }
        .title-bar {
            background-color: #e1e1e1;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            font-size: 13px;
            color: #333;
            user-select: none;
        }
        .window-controls span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 6px;
        }
        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .maximize { background-color: #27c93f; }
        .content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label {
            font-size: 13px;
            color: #222;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .resultado {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            color: #111;
            min-height: 24px;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>Calculadora
        </span>
        <div class="window-controls">
            <span class="minimize"></span>
            <span class="maximize"></span>
            <span class="close"></span>
        </div>
    </div>
    <div class="content">
        <label for="num1">1º Número:</label>
        <input type="number" id="num1" placeholder="Ex: 9">

        <label for="num2">2º Número (se aplicável):</label>
        <input type="number" id="num2" placeholder="Ex: 3">

        <label for="operacao">Operação:</label>
        <select id="operacao" onchange="verificarOperacao()">
            <option value="Soma">Soma (+)</option>
            <option value="Subtração">Subtração (-)</option>
            <option value="Multiplicação">Multiplicação (*)</option>
            <option value="Divisão">Divisão (/)</option>
            <option value="Potência">Potência (^)</option>
            <option value="Raiz Quadrada">Raiz Quadrada (√)</option>
        </select>

        <button onclick="calcular()">Calcular</button>

        <div class="resultado" id="resultado">Resultado: </div>
    </div>
</div>

<script>
    function verificarOperacao() {
        const op = document.getElementById('operacao').value;
        const inputNum2 = document.getElementById('num2');
        if (op === 'Raiz Quadrada') {
            inputNum2.disabled = true;
            inputNum2.style.backgroundColor = '#e9e9e9';
            inputNum2.placeholder = 'Não necessário';
        } else {
            inputNum2.disabled = false;
            inputNum2.style.backgroundColor = '#ffffff';
            inputNum2.placeholder = 'Ex: 3';
        }
    }

    function calcular() {
        const op = document.getElementById('operacao').value;
        const v1 = document.getElementById('num1').value;
        const v2 = document.getElementById('num2').value;
        const resDiv = document.getElementById('resultado');

        if (v1 === '') {
            resDiv.innerText = 'Digite o 1º número!';
            resDiv.style.color = '#d9534f';
            return;
        }

        const num1 = parseFloat(v1);

        if (op === 'Raiz Quadrada') {
            if (num1 < 0) {
                resDiv.innerText = 'Erro: Raiz de número negativo!';
                resDiv.style.color = '#d9534f';
            } else {
                const res = Math.sqrt(num1);
                resDiv.innerText = `Resultado: ${Number.isInteger(res) ? res : res.toFixed(2)}`;
                resDiv.style.color = '#111';
            }
            return;
        }

        if (v2 === '') {
            resDiv.innerText = 'Digite o 2º número!';
            resDiv.style.color = '#d9534f';
            return;
        }

        const num2 = parseFloat(v2);
        let res = 0;

        if (op === 'Soma') res = num1 + num2;
        else if (op === 'Subtração') res = num1 - num2;
        else if (op === 'Multiplicação') res = num1 * num2;
        else if (op === 'Divisão') {
            if (num2 === 0) {
                resDiv.innerText = 'Erro: Divisão por zero!';
                resDiv.style.color = '#d9534f';
                return;
            }
            res = num1 / num2;
        } else if (op === 'Potência') res = Math.pow(num1, num2);

        resDiv.style.color = '#111';
        resDiv.innerText = `Resultado: ${Number.isInteger(res) ? res : res.toFixed(2)}`;
    }
</script>

</body>
</html>
